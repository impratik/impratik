{% extends "base.html" %}

{% block title %}Add Property - Khochare Real Estate{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="mb-4">Add New Property</h1>

            <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="title" class="form-label">Property Title *</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="property_type" class="form-label">Property Type *</label>
                        <select class="form-select" id="property_type" name="property_type" required>
                            <option value="">Select Type</option>
                            <option value="apartment">Apartment</option>
                            <option value="house">House</option>
                            <option value="land">Land</option>
                            <option value="commercial">Commercial</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label">Location *</label>
                    <input type="text" class="form-control" id="location" name="location" required>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="bedrooms" class="form-label">Bedrooms</label>
                        <input type="number" class="form-control" id="bedrooms" name="bedrooms" min="0">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="bathrooms" class="form-label">Bathrooms</label>
                        <input type="number" class="form-control" id="bathrooms" name="bathrooms" min="0">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="area_sqft" class="form-label">Area (sqft)</label>
                        <input type="number" class="form-control" id="area_sqft" name="area_sqft" step="0.01" min="0">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">Price *</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input type="number" class="form-control" id="price" name="price" step="0.01" min="0" required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Price Negotiable?</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="negotiable" name="negotiable">
                            <label class="form-check-label" for="negotiable">
                                Yes, price is negotiable
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="images" class="form-label">Property Images</label>
                    <input type="file" class="form-control" id="images" name="images" multiple accept="image/*">
                    <small class="form-text text-muted">Upload multiple images (JPG, PNG)</small>
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn btn-success btn-lg">Add Property</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
